name: Build LibreTV Android TV APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      ANDROID_COMPILE_SDK: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'

      - name: Bootstrap and verify official Gradle 8.9 Wrapper JAR
        run: bash tools/bootstrap-gradle-wrapper.sh

      - name: Configure Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build frontend, package APK, and fail-closed verify
        run: bash tools/build-apk.sh

      # This step only runs after a successful build + aapt/APK structure/signature checks.
      # There is deliberately no always()/failure() artifact upload for APK files.
      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: LibreTV-AndroidTV-debug-${{ github.sha }}
          path: |
            dist/LibreTV-TV-debug.apk
            dist/LibreTV-TV-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
